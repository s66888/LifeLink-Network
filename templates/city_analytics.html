<!DOCTYPE html>
<html>

<head>

    <title>City Analytics</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{

            background:linear-gradient(
                135deg,
                #120000,
                #1b0000,
                #240000
            );

            color:white;

            min-height:100vh;
        }

        .main-card{

            background:#1e1e1e;

            border-radius:25px;

            padding:40px;

            margin-top:50px;

            box-shadow:0 0 30px rgba(255,0,0,0.15);
        }

        .title{

            text-align:center;

            font-size:42px;

            font-weight:bold;

            color:#ff4d4d;

            margin-bottom:50px;
        }

        .city-card{

            background:#2a2a2a;

            border-radius:20px;

            padding:30px;

            text-align:center;

            transition:0.3s;

            height:100%;
        }

        .city-card:hover{

            transform:translateY(-5px);

            box-shadow:0 0 20px rgba(255,0,0,0.2);
        }

        .city-name{

            font-size:28px;

            font-weight:bold;
        }

        .count{

            font-size:55px;

            font-weight:bold;

            color:#ff4d4d;

            margin-top:15px;
        }

        .label{

            color:#cccccc;

            margin-top:10px;
        }
        .back-btn{

            display:inline-flex;
        
            align-items:center;
        
            gap:8px;
        
            padding:10px 16px;
        
            background:#2a2a2a;
        
            color:white;
        
            border-radius:12px;
        
            text-decoration:none;
        
            margin-bottom:25px;
        
            transition:.3s;
        }
        
        .back-btn:hover{
        
            background:#ff1a1a;
        
            color:white;
        
            transform:translateX(-4px);
        }

    </style>

</head>

<body>
<div style="
    padding:20px 30px;
">

<a href="/user-dashboard" class="back-btn">

    <i class="fa-solid fa-chevron-left"></i>

    <span>Back</span>

</a>

</div>

<div class="container">

    <div class="main-card">

        <div class="title">
            City-wise Donor Analytics
        </div>

        <div class="row g-4 justify-content-start">

            {% for city in cities %}

            <div class="col-md-4">

                <div class="city-card">

                    <div class="city-name">

                        📍 {{ city[0] }}

                    </div>

                    <div class="count">

                        {{ city[1] }}

                    </div>

                    <div class="label">

                        Registered Donors

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>



    </div>

</div>

</body>
</html>
