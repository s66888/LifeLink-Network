<!DOCTYPE html>
<html>

<head>

    <title>Analytics Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        body{

            background:#f4f6f9;

            font-family:Arial,sans-serif;
        }

        .header{

            text-align:center;

            margin:40px 0;
        }

        .header h1{

            color:#8b0000;

            font-weight:bold;
        }

        .card-box{

            background:white;

            border-radius:20px;

            padding:30px;

            text-align:center;

            box-shadow:0 4px 15px rgba(0,0,0,0.08);

            transition:.3s;

            height:100%;
        }

        .card-box:hover{

            transform:translateY(-5px);
        }

        .icon{

            font-size:45px;

            color:#8b0000;

            margin-bottom:15px;
        }

        .count{

            font-size:40px;

            font-weight:bold;

            color:#222;
        }

        .title{

            font-size:18px;

            color:#666;
        }

        .back-btn{

            display:inline-block;

            margin:20px;

            padding:10px 18px;

            background:#8b0000;

            color:white;

            text-decoration:none;

            border-radius:10px;
        }

    </style>

</head>

<body>

<a
    href="/admin-dashboard"
    class="back-btn"
>

    ← Back

</a>

<div class="container">

    <div class="header">

        <h1>

            Analytics Dashboard

        </h1>

        <p>

            LifeLink System Overview

        </p>

    </div>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card-box">

                <div class="icon">

                    <i class="fa-solid fa-users"></i>

                </div>

                <div class="count">

                    {{ total_users }}

                </div>

                <div class="title">

                    Total Users

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card-box">

                <div class="icon">

                    <i class="fa-solid fa-hand-holding-medical"></i>

                </div>

                <div class="count">

                    {{ total_donors }}

                </div>

                <div class="title">

                    Total Donors

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card-box">

                <div class="icon">

                    <i class="fa-solid fa-droplet"></i>

                </div>

                <div class="count">

                    {{ total_requests }}

                </div>

                <div class="title">

                    Total Requests

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card-box">

                <div class="icon">

                    <i class="fa-solid fa-circle-check"></i>

                </div>

                <div class="count">

                    {{ completed_requests }}

                </div>

                <div class="title">

                    Completed Requests

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
