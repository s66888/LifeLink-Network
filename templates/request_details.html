<!DOCTYPE html>
<html>

<head>

    <title>Request Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body style="background:#f4f6f9;">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-danger">

            {{ request.blood_group }}

        </h2>

        <h3>

            {{ request.patient_name }}

        </h3>

        <hr>

        <p>
            <b>City:</b>
            {{ request.city }}
        </p>

        <p>
            <b>Hospital:</b>
            {{ request.hospital }}
        </p>

        <p>
            <b>Contact:</b>
            {{ request.contact }}
        </p>

        <p>
            <b>Urgency:</b>
            {{ request.urgency }}
        </p>

        <p>
            <b>Status:</b>
            {{ request.status }}
        </p>

        <a
            href="/accept-request/{{ request.id }}"
            class="btn btn-danger"
        >

            Accept Request

        </a>

    </div>

</div>

</body>

</html>
