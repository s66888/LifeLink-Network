<!DOCTYPE html>
<html>

<head>

    <title>Mobile App Center</title>


    <style>

        body{

            background:linear-gradient(
                135deg,
                #120000,
                #1b0000,
                #240000
            );

            color:white;

            min-height:100vh;
        }

        .main-card{

            background:#1e1e1e;

            border-radius:25px;

            padding:40px;

            margin-top:50px;

            text-align:center;

            box-shadow:0 0 30px rgba(255,0,0,0.15);
        }

        .title{

            font-size:42px;

            font-weight:bold;

            color:#ff4d4d;

            margin-bottom:30px;
        }

        .mobile-box{

            background:#2a2a2a;

            border-radius:25px;

            padding:40px;

            max-width:400px;

            margin:auto;
        }

        .mobile-icon{

            font-size:100px;

            margin-bottom:20px;
        }

        .download-btn{

            margin-top:25px;

            padding:14px 30px;

            border-radius:12px;

            font-weight:bold;
        }

    </style>

</head>

<body>
<div style="
    padding:20px 30px;
">

<a href="/user-dashboard" class="back-btn">

    <i class="fa-solid fa-chevron-left"></i>

    <span>Back</span>

</a>

</div>


<div class="container">

    <div class="main-card">

        <div class="title">

            Mobile App Center

        </div>

        <div class="mobile-box">

            <div class="mobile-icon">

                📱

            </div>

            <h3>

                LifeLink Mobile App

            </h3>

            <p class="mt-3 text-secondary">

                Access emergency blood donation
                services directly from your mobile device.

            </p>

            <button
                class="btn btn-danger download-btn"
            >

                Download Android App

            </button>

        </div>



    </div>

</div>

</body>
</html>
