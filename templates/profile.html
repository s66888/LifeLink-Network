<!DOCTYPE html>
<html>

<head>

    <title>My Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        body{

            background:#f4f7fb;

            font-family:'Segoe UI',sans-serif;
        }

        .profile-card{

            max-width:700px;

            margin:60px auto;

            background:white;

            border-radius:25px;

            padding:35px;

            box-shadow:0 10px 25px rgba(0,0,0,.08);

            border-top:5px solid #8b0000;
        }

        .avatar{

            width:100px;

            height:100px;

            border-radius:50%;

            background:#ffe5e5;

            color:#8b0000;

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:45px;

            margin:0 auto 20px;
        }

        .profile-title{

            text-align:center;

            font-size:32px;

            font-weight:700;

            color:#8b0000;

            margin-bottom:30px;
        }

        .info-row{

            display:flex;

            justify-content:space-between;

            padding:14px 0;

            border-bottom:1px solid #eee;
        }

        .label{

            font-weight:700;

            color:#444;
        }

        .value{

            color:#222;
        }

        .availability{

            padding:6px 16px;

            border-radius:20px;

            color:white;

            font-weight:600;
        }

        .available{

            background:#198754;
        }

        .unavailable{

            background:#dc3545;
        }

.profile-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.edit-btn{

    background:#8b0000;

    color:white;

    text-decoration:none;

    padding:10px 18px;

    border-radius:12px;

    font-weight:600;

    transition:.3s;
}

.edit-btn:hover{

    background:#b30000;

    color:white;
}

    </style>

</head>

<body>

<div class="profile-card">

    <div class="profile-header">

        <h2>My Profile</h2>

        <a
            href="/edit-profile"
            class="edit-btn"
        >
            <i class="fa-solid fa-pen"></i>
            Edit
        </a>

    </div>

    <div class="info-row">

        <span>Username</span>

        <strong>{{ user[0] }}</strong>

    </div>

    <div class="info-row">

        <span>Email</span>

        <strong>{{ user[1] }}</strong>

    </div>

    <div class="info-row">

        <span>Blood Group</span>

        <strong>{{ user[2] or 'Not Added' }}</strong>

    </div>

    <div class="info-row">

        <span>City</span>

        <strong>{{ user[3] or 'Not Added' }}</strong>

    </div>

    <div class="info-row">

        <span>Contact Number</span>

        <strong>{{ user[4] or 'Not Added' }}</strong>

    </div>

    <div class="info-row">

        <span>Availability</span>

        <strong>{{ user[5] or 'Not Available' }}</strong>

    </div>

</div>



</div>

</body>

</html>
