<!DOCTYPE html>
<html>

<head>

    <title>Emergency Notifications</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        body{

            background:linear-gradient(
                135deg,
                #120000,
                #1b0000,
                #240000
            );

            color:white;

            min-height:100vh;
        }

        .main-card{

            background:#1e1e1e;

            border-radius:25px;

            padding:40px;

            margin-top:50px;

            box-shadow:0 0 30px rgba(255,0,0,0.15);
        }

        .title{

            text-align:center;

            font-size:42px;

            font-weight:bold;

            color:#ff4d4d;

            margin-bottom:50px;
        }

        .notification-card{

            background:#2a2a2a;

            border-left:5px solid #ff4d4d;

            border-radius:15px;

            padding:25px;

            margin-bottom:20px;
        }

        .time{

            color:#cccccc;

            font-size:14px;

            margin-top:10px;
        }
        .back-btn{

            display:inline-flex;
        
            align-items:center;
        
            gap:8px;
        
            padding:10px 16px;
        
            background:#2a2a2a;
        
            color:white;
        
            border-radius:12px;
        
            text-decoration:none;
        
            margin-bottom:25px;
        
            transition:.3s;
        }
        
        .back-btn:hover{
        
            background:#ff1a1a;
        
            color:white;
        
            transform:translateX(-4px);
        }

    </style>

</head>

<body>

<div style="
    padding:20px 30px;
    ">
    
    <a href="/user-dashboard" class="back-btn">
    
        <i class="fa-solid fa-chevron-left"></i>
    
        <span>Back</span>
    
    </a>
    
</div>

<div class="container">

    <div class="main-card">

        <div class="title">

            Emergency Notifications

        </div>

        {% for notification in notifications %}

        <div class="notification-card">

            <h5>

                🚨 Emergency Alert

            </h5>

            <p>

                {{ notification[1] }}

            </p>

            <div class="time">

                {{ notification[2] }}

            </div>

        </div>

        {% endfor %}



    </div>

</div>

</body>
</html>
