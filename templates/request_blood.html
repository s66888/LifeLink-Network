<!DOCTYPE html>
<html>

<head>

    <title>Request Blood</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <style>

        body{

            background:#f4f6f9;

            font-family:Arial,sans-serif;
        }

        .main-box{

            max-width:700px;

            margin:auto;

            margin-top:50px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 2px 12px rgba(0,0,0,0.08);
        }

        .title{

            text-align:center;

            font-size:36px;

            font-weight:bold;

            color:#8b0000;

            margin-bottom:35px;
        }

        .form-label{

            font-weight:bold;

            color:#444;
        }

        .form-control{

            height:50px;

            border-radius:12px;

            border:1px solid #ccc;

            color:#333;

            background:white;
        }

        .form-control:focus{

            border-color:#8b0000;

            box-shadow:none;
        }

        .btn-custom{

            background:#8b0000;

            color:white;

            height:50px;

            border:none;

            border-radius:12px;

            width:100%;

            font-size:18px;

            font-weight:bold;

            margin-top:20px;
        }

        .btn-custom:hover{

            background:#a80000;
        }
        .back-btn{

            display:inline-flex;
        
            align-items:center;
        
            gap:8px;
        
            padding:10px 16px;
        
            background:#2a2a2a;
        
            color:white;
        
            border-radius:12px;
        
            text-decoration:none;
        
            margin-bottom:25px;
        
            transition:.3s;
        }
        
        .back-btn:hover{
        
            background:#ff1a1a;
        
            color:white;
        
            transform:translateX(-4px);
        }

    </style>

</head>

<body>

<div style="
    padding:20px 30px;
    ">
    
    <a href="/user-dashboard" class="back-btn">
    
        <i class="fa-solid fa-chevron-left"></i>
    
        <span>Back</span>
    
    </a>
    
</div>




<div class="container">

    <div class="main-box">

        <div class="title">

            Emergency Blood Request

        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">

                    Patient Name

                </label>

                <input
                    type="text"
                    name="patient_name"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Blood Group

                </label>

                <select
                    name="blood_group"
                    class="form-control"
                    required
                >

                    <option value="">
                        Select Blood Group
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    City

                </label>

                <input
                    type="text"
                    name="city"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Hospital

                </label>

                <input
                    type="text"
                    name="hospital"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Contact Number

                </label>

                <input
                    type="text"
                    name="contact"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Urgency Level

                </label>

               <option value="">
                   Select Urgency
               </option>
               
               <option>Low</option>
               <option>Medium</option>
               <option>High</option>
               <option>Critical</option>

            </div>

            <button
                 type="submit"
                 onclick="this.disabled=true; this.form.submit();"
                 class="btn btn-danger"
             >
                 Submit Request
             </button>

        </form>

    </div>

</div>

</body>

</html>
