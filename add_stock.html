<!DOCTYPE html>
<html>

<head>

    <title>Add Blood Stock</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
    <style>
      .back-btn{

            display:inline-flex;
        
            align-items:center;
        
            gap:8px;
        
            padding:10px 16px;
        
            background:#2a2a2a;
        
            color:white;
        
            border-radius:12px;
        
            text-decoration:none;
        
            margin-bottom:25px;
        
            transition:.3s;
        }
        
        .back-btn:hover{
        
            background:#ff1a1a;
        
            color:white;
        
            transform:translateX(-4px);
        }  
    </style>



</head>

<body style="background:#f4f6f9;">
<div style="
    padding:20px 30px;
    ">
    
    <a href="/user-dashboard" class="back-btn">
    
        <i class="fa-solid fa-chevron-left"></i>
    
        <span>Back</span>
    
    </a>
    
</div>

<div class="container mt-5">

    <div class="bg-white p-5 rounded shadow">

        <h1 class="mb-4 text-danger">

            Add Blood Stock

        </h1>

        <form method="POST">

            <input
                type="text"
                name="blood_group"
                class="form-control mb-3"
                placeholder="Blood Group"
                required
            >

            <input
                type="number"
                name="units"
                class="form-control mb-3"
                placeholder="Units Available"
                required
            >

            <input
                type="text"
                name="hospital"
                class="form-control mb-3"
                placeholder="Hospital Name"
                required
            >

            <button class="btn btn-danger">

                Save Stock

            </button>

        </form>

    </div>

</div>

</body>
</html>
